name: Build iPhone app

# Builds the iPhone app on GitHub's Mac machines.
# - Without the Apple secrets: a test compile only (proves the app builds; nothing is uploaded).
# - With the 4 Apple secrets: signs the app and uploads it to App Store Connect, ready for TestFlight.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the app's web files
        run: npm run build
        env:
          BUILD_ID: ${{ github.run_number }}

      - name: Create the iOS project
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor "#3f3a8c" --iconBackgroundColorDark "#3f3a8c" \
            --splashBackgroundColor "#f5f4f9" --splashBackgroundColorDark "#12111a"
          PLIST=ios/App/App/Info.plist
          plutil -replace CFBundleDisplayName -string "Baby Chart" "$PLIST"
          # Only standard HTTPS is used, so the app is exempt from export-compliance paperwork
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"
          npx cap sync ios
          ls ios/App

      - name: Build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ios/App
          # Run a command, keep its full output in a log, and on failure turn the error lines into
          # GitHub annotations (so they show on the run's summary page).
          run_logged () {
            local name="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              grep -E "error:|Error |ERROR|failed|No profiles|No signing|requires a provisioning|No suitable|Provisioning profile|certificate" "$RUNNER_TEMP/$name.log" \
                | grep -v "^\s*$" | sort -u | head -n 25 | while IFS= read -r line; do echo "::error title=$name::${line:0:900}"; done
              tail -n 60 "$RUNNER_TEMP/$name.log"
              return 1
            fi
            tail -n 5 "$RUNNER_TEMP/$name.log"
          }
          if [ -d App.xcworkspace ]; then PROJ=(-workspace App.xcworkspace); else PROJ=(-project App.xcodeproj); fi
          COMMON=("${PROJ[@]}" -scheme App -configuration Release -destination generic/platform=iOS
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=1.0.$BUILD_NUMBER TARGETED_DEVICE_FAMILY=1)

          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple secrets aren't set yet, so this is a test compile only. Nothing is signed or uploaded."
            run_logged test-compile xcodebuild "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO build
            echo "::notice::The iPhone app compiled successfully (test build, not signed)."
            exit 0
          fi

          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # The secret can be the .p8 file's text pasted as-is, or that file in base64
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY" 2>/dev/null || true
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error title=Apple API key::The ASC_KEY_P8_BASE64 secret isn't a valid key. Open the AuthKey_....p8 file in Notepad, copy everything (including the BEGIN and END lines) and paste it as the secret."
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error title=Apple API key::The ASC_KEY_ID or ASC_ISSUER_ID secret is missing."
            exit 1
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # 1. Build the archive (unsigned; it's signed for the App Store in step 2)
          run_logged archive xcodebuild "${COMMON[@]}" archive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO

          # 2. Sign with Apple's cloud-managed distribution certificate and upload to App Store Connect
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          run_logged upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice::Uploaded build $BUILD_NUMBER to App Store Connect. It appears in TestFlight once Apple finishes processing (usually 5-30 minutes)."
